<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <h1>Universal Registration & Management Form</h1>
    <hr>

    <form action="submit">

    <fieldset>
        <legend><b>Personal Details</b></legend><br>
        <label for="">Full Name:</label>
        <input type="text"><br><br>
        <label for="">Email :</label>
        <input type="email"><br><br>
        <label for="">Phone Number :</label>
        <input type="number" name="" id=""><br><br>
        <label for="">Date of Birth :</label>
        <input type="date" name="" id=""><br><br>
        <label for="">Gender :</label>
        <input type="radio">Male
        <input type="radio" name="" id="">Female
        <input type="radio" name="" id="">Others <br><br>
        <label for="">Marital Status :</label>

        <select name="" id="">
            <option value="">--Select--</option>
            <option value="">Single</option>
            <option value="">Married</option>
            <option value="">Widowed</option>
        </select>
    </fieldset>
<br>
    <fieldset>
        <legend><strong>Education Details</strong></legend><br>

        <label for="">Highest Qualification: </label>
        <select name="" id="">
                <option value="">--Select Qualification--</option>
                <option value="">BE</option>
                <option value="">MBA</option>
        </select>
        <br><br>
        <label for="">College Name: </label>
        <input type="text"><br><br>
        <label for="">Year of Passing:</label>
        <input type="text" name="" id=""><br><br>
        <label for="">Percentage: </label>

        <input type="text" name="" id=""><br><br>
    </fieldset>

    <fieldset>
        <legend>Professional Details</legend>
        <br>
        <label for="">Experience:</label>
        <input type="text" name="" id=""><br><br>
        <label for="">Skills: </label>
        <input type="checkbox" name="" id="">HTML
        <input type="checkbox" name="" id="">CSS
        <input type="checkbox" name="" id="">JavaScript
        <input type="checkbox" name="" id="" required>React
<br><br>
        <label for="">Current company: </label>
        <input type="text" name="" id=""><br><br>
        <label for="">Expected salary: </label>
        <label for="">Address :</label>
        <textarea rows="3" cols="100"></textarea>

    </fieldset>
    <br>
    <input type="checkbox" name="" id="">  I hereby declare that the above information is true and correct.
<br><br>
    <button type="submit" >Submit</button>
    <button type="reset">Reset Form</button><hr>
    <p>&copy; 2026 Universal Registration System</p>
    </form>


</body>
</html>
